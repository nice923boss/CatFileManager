<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatFileManager 改進清單</title>
<style>
:root {
  --bg: #f5f5f4; --surface: #ffffff; --surface-2: #efefed; --border: #d9d9d6;
  --text: #1f1f1f; --muted: #6b6b68; --accent: #0a6cc2; --accent-soft: #e3effa;
  --star: #b7791f; --s: #2f855a; --m: #b7791f; --l: #c0392b; --checked: #f1f7fd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --surface: #252526; --surface-2: #2d2d2d; --border: #3e3e3e;
    --text: #e6e6e6; --muted: #9a9a9a; --accent: #3fa3f0; --accent-soft: #1c3448;
    --star: #e8b84b; --s: #5fbf87; --m: #e8b84b; --l: #f07167; --checked: #1f2c38;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --surface: #252526; --surface-2: #2d2d2d; --border: #3e3e3e;
  --text: #e6e6e6; --muted: #9a9a9a; --accent: #3fa3f0; --accent-soft: #1c3448;
  --star: #e8b84b; --s: #5fbf87; --m: #e8b84b; --l: #f07167; --checked: #1f2c38;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 120px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.toolbar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.toolbar input[type=search] {
  flex: 1 1 200px; min-width: 0; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit;
}
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.legend { color: var(--muted); font-size: 13px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 14px; }
section { margin-bottom: 26px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.sec-head h2 { font-size: 18px; margin: 0; }
.sec-count { color: var(--muted); font-size: 13px; }
.sec-head button { margin-left: auto; }
.item {
  display: grid; grid-template-columns: 22px 1fr; gap: 4px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 6px;
}
.item.on { background: var(--checked); border-color: var(--accent); }
.item input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.item label { cursor: pointer; }
.title-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.id { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
.t { font-weight: 600; }
.desc { grid-column: 2; color: var(--muted); font-size: 14px; }
.badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.e-S { color: var(--s); } .e-M { color: var(--m); } .e-L { color: var(--l); }
.rec { color: var(--star); }
.note {
  grid-column: 2; display: none; margin-top: 4px; width: 100%; padding: 6px 8px;
  border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font: inherit; font-size: 14px;
}
.item.on .note { display: block; }
.hidden { display: none !important; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.bar .count { font-weight: 600; margin-right: 6px; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: #fff;
  border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.toast { color: var(--s); font-size: 13px; min-width: 6em; }
dialog {
  width: min(720px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); padding: 16px;
}
dialog textarea {
  width: 100%; height: 50vh; font-family: Consolas, "Microsoft JhengHei", monospace; font-size: 13px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
}
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CatFileManager 改進清單（100 項）</h1>
  <p class="lead">勾選想製作的項目，可在備註欄補充想法。完成後按下方「複製勾選結果」，貼回對話即可。勾選狀態會暫存在此瀏覽器。</p>

  <div class="toolbar" role="toolbar" aria-label="篩選">
    <input type="search" id="q" placeholder="搜尋項目…" aria-label="搜尋項目">
    <button class="chip" id="f-rec" aria-pressed="false">★ 只看推薦</button>
    <button class="chip" id="f-on" aria-pressed="false">只看已勾選</button>
    <button class="chip" data-eff="S" aria-pressed="false">小</button>
    <button class="chip" data-eff="M" aria-pressed="false">中</button>
    <button class="chip" data-eff="L" aria-pressed="false">大</button>
  </div>

  <div class="legend">
    <span><span class="badge e-S">小</span> 半天內</span>
    <span><span class="badge e-M">中</span> 1 到 2 天</span>
    <span><span class="badge e-L">大</span> 3 天以上或需架構調整</span>
    <span><span class="badge rec">★ 推薦</span> 投入少、日常感受明顯</span>
  </div>

  <main id="list"></main>
</div>

<div class="bar">
  <span class="count" id="count">已勾選 0 / 100</span>
  <button class="btn" id="copy">複製勾選結果</button>
  <button class="btn ghost" id="show">檢視文字</button>
  <button class="btn ghost" id="dl">下載 .txt</button>
  <button class="btn ghost" id="reset">清除全部</button>
  <span class="toast" id="toast" aria-live="polite"></span>
</div>

<dialog id="dlg">
  <textarea id="out" readonly aria-label="勾選結果"></textarea>
  <div class="row">
    <button class="btn" id="dlg-copy">複製</button>
    <button class="btn ghost" id="dlg-close">關閉</button>
  </div>
</dialog>

  ["I06", "我的最愛圖示與失效偵測", "顯示資料夾圖示，路徑不存在時標示提醒。", "S", 0],
  ["I07", "視窗置頂與透明度", "可設定視窗永遠在最上層、調整透明度。", "S", 0],

  ["J01", "圖示改背景載入", "大型資料夾捲動時，圖示在背景載入，不卡畫面。", "M", 1],
  ["J02", ".lnk 圖示快取共用", "捷徑圖示快取跨資料夾共用並限制大小，減少重複解析。", "S", 0],
  ["J03", "超大資料夾分批載入", "十萬個檔案的資料夾也能流暢開啟。", "L", 0],
  ["J04", "設定儲存失敗要提示", "目前存設定失敗會靜默忽略，改為提示使用者。", "S", 0],
  ["J05", "統一 log 位置", "目前 log 分散在 ~/.catfm_app.log 與 ~/.catfm/app.log 兩處。", "S", 0],
  ["J06", "磁碟拔除與斷線處理", "隨身碟拔除或網路斷線時，面板顯示提示並自動回到可用路徑。", "S", 0],
  ["J07", "長路徑支援", "支援超過 260 字元的深層路徑。", "M", 0],

  ["K01", "建立 git 版本控制", "專案目前不是 git repo，改動無法追溯與還原。", "S", 1],
  ["K02", "清理遺留檔案", "清掉 _panels_original.bak、dist_old、_dist_locked、空的 _run.log。", "S", 0],
  ["K03", "一鍵打包腳本", "自動關閉執行中程式、打包、標版本號。", "S", 1],
  ["K04", "關於視窗與版本號", "顯示版本號與更新紀錄。", "S", 0],
  ["K05", "補齊自動化測試", "檔案操作、改名、壓縮、解壓的測試。", "M", 0],
  ["K06", "剪貼簿狀態改成類別管理", "目前用全域變數記錄剪下與複製，改為集中管理，減少跨面板錯亂。", "S", 0],
  ["K07", "程式碼格式與 lint 檢查", "導入 ruff、black，統一程式碼風格。", "S", 0],
];

const EFF_LABEL = { S: "小", M: "中", L: "大" };
const KEY = "catfm-checklist-v1";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
let state = load(); // { id: { on: bool, note: str } }

const list = document.getElementById("list");

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  list.innerHTML = CATS.map(([c, name]) => {
    const rows = ITEMS.filter(it => it[0][0] === c).map(([id, t, d, e, rec]) => {
      const st = state[id] || {};
      return `<div class="item${st.on ? " on" : ""}" data-id="${id}" data-eff="${e}" data-rec="${rec}">
        <input type="checkbox" id="cb-${id}" ${st.on ? "checked" : ""}>
        <label for="cb-${id}" class="title-line">
          <span class="id">${id}</span><span class="t">${esc(t)}</span>
          <span class="badge e-${e}">${EFF_LABEL[e]}</span>${rec ? '<span class="badge rec">★ 推薦</span>' : ""}
        </label>
        <div class="desc">${esc(d)}</div>
        <input class="note" type="text" placeholder="備註（選填）" value="${esc(st.note || "")}" aria-label="${id} 備註">
      </div>`;
    }).join("");
    return `<section data-cat="${c}">
      <div class="sec-head"><h2>${c}. ${name}</h2><span class="sec-count"></span>
        <button class="chip" data-all="${c}">本類全選／取消</button></div>${rows}</section>`;
  }).join("");
}

function update() {
  let n = 0;
  document.querySelectorAll("section").forEach(sec => {
    const items = sec.querySelectorAll(".item");
    const on = sec.querySelectorAll(".item.on").length;
    n += on;
    sec.querySelector(".sec-count").textContent = `${on} / ${items.length}`;
  });
  document.getElementById("count").textContent = `已勾選 ${n} / ${ITEMS.length}`;
  applyFilter();
}

const filters = { q: "", rec: false, on: false, eff: new Set() };
function applyFilter() {
  const q = filters.q.trim().toLowerCase();
  document.querySelectorAll(".item").forEach(el => {
    const text = el.textContent.toLowerCase();
    const show = (!q || text.includes(q))
      && (!filters.rec || el.dataset.rec === "1")
      && (!filters.on || el.classList.contains("on"))
      && (!filters.eff.size || filters.eff.has(el.dataset.eff));
    el.classList.toggle("hidden", !show);
  });
  document.querySelectorAll("section").forEach(sec => {
    sec.classList.toggle("hidden", !sec.querySelector(".item:not(.hidden)"));
  });
}

function setItem(el, on) {
  const id = el.dataset.id;
  el.classList.toggle("on", on);
  el.querySelector("input[type=checkbox]").checked = on;
  state[id] = { ...(state[id] || {}), on };
}

list.addEventListener("change", e => {
  if (e.target.type === "checkbox") {
    setItem(e.target.closest(".item"), e.target.checked);
    save(); update();
  }
});
list.addEventListener("input", e => {
  if (e.target.classList.contains("note")) {
    const id = e.target.closest(".item").dataset.id;
    state[id] = { ...(state[id] || {}), note: e.target.value };
    save();
  }
});
list.addEventListener("click", e => {
  const c = e.target.dataset && e.target.dataset.all;
  if (!c) return;
  const items = [...document.querySelectorAll(`section[data-cat="${c}"] .item:not(.hidden)`)];
  const allOn = items.every(el => el.classList.contains("on"));
  items.forEach(el => setItem(el, !allOn));
  save(); update();
});

document.getElementById("q").addEventListener("input", e => { filters.q = e.target.value; applyFilter(); });
document.getElementById("f-rec").addEventListener("click", e => {
  filters.rec = !filters.rec; e.target.setAttribute("aria-pressed", filters.rec); applyFilter();
});
document.getElementById("f-on").addEventListener("click", e => {
  filters.on = !filters.on; e.target.setAttribute("aria-pressed", filters.on); applyFilter();
});
document.querySelectorAll("[data-eff].chip").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.eff;
  filters.eff.has(k) ? filters.eff.delete(k) : filters.eff.add(k);
  b.setAttribute("aria-pressed", filters.eff.has(k)); applyFilter();
}));

function resultText() {
  const picked = ITEMS.filter(([id]) => state[id] && state[id].on);
  const lines = [`CatFileManager 改進勾選結果（${picked.length} 項）`, ""];
  CATS.forEach(([c, name]) => {
    const group = picked.filter(it => it[0][0] === c);
    if (!group.length) return;
    lines.push(`【${c}. ${name}】`);
    group.forEach(([id, t]) => {
      const note = (state[id].note || "").trim();
      lines.push(`[${id}] ${t}${note ? `｜備註：${note}` : ""}`);
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  setTimeout(() => { t.textContent = ""; }, 2500);
}

async function copyText() {
  const text = resultText();
  try {
    await navigator.clipboard.writeText(text);
    toast("已複製");
  } catch (e) {
    openDialog();
    toast("請在視窗中手動複製");
  }
}

const dlg = document.getElementById("dlg");
function openDialog() {
  const out = document.getElementById("out");
  out.value = resultText();
  dlg.showModal();
  out.select();
}

document.getElementById("copy").addEventListener("click", copyText);
document.getElementById("show").addEventListener("click", openDialog);
document.getElementById("dlg-copy").addEventListener("click", copyText);
document.getElementById("dlg-close").addEventListener("click", () => dlg.close());
document.getElementById("dl").addEventListener("click", () => {
  const blob = new Blob([resultText()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "CatFileManager_改進勾選結果.txt";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("確定清除全部勾選與備註？")) return;
  state = {}; save(); render(); update();
});

render();
update();
</script>
</body>
</html>
