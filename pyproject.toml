[project]
name = "catfilemanager"
version = "1.0.0"
description = "Quad-panel file manager for Windows (PySide6)"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: Qt idiom parent=QModelIndex()

[tool.pytest.ini_options]
testpaths = ["tests"]
