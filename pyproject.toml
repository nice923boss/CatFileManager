[project]
name = "catfilemanager"
version = "1.1.0"
description = "Quad-panel file manager for Windows (PySide6)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.11", "Send2Trash>=2.1", "pywin32>=311"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: Qt idiom parent=QModelIndex()

[tool.pytest.ini_options]
testpaths = ["tests"]
